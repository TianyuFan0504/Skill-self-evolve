# Shared configuration; Hydra search paths belong to primary recipes.
# Only original ALFWorld train tasks enter optimization; dev is train-derived.
data:

  train_files: ${oc.env:SKILL_DATA_DIR}/train.parquet

  val_files: ${oc.env:SKILL_DATA_DIR}/dev.parquet

  return_raw_chat: true

  max_prompt_length: ${oc.decode:${oc.env:MAX_PROMPT_LENGTH,4096}}

  max_response_length: ${oc.decode:${oc.env:MAX_RESPONSE_LENGTH,32768}}

  train_batch_size: ${oc.decode:${oc.env:TRAIN_BATCH_SIZE,16}}

  val_batch_size: ${oc.decode:${oc.env:VAL_BATCH_SIZE,16}}

  val_max_samples: ${oc.decode:${oc.env:DEV_MAX_SAMPLES,64}}

  shuffle: true

  seed: ${oc.decode:${oc.env:DATA_SEED,42}}

  validation_shuffle: false

  filter_overlong_prompts: true

  truncation: error

  dataloader_num_workers: 4

  apply_chat_template_kwargs:

    enable_thinking: false

# Standard GRPO remains the solver objective.
algorithm:

  adv_estimator: grpo

  norm_adv_by_std_in_grpo: true

  use_kl_in_reward: false

  rollout_correction:

    bypass_mode: false

    rollout_is: token

    rollout_is_threshold: 2.0

    rollout_rs: null

# Use the official custom AgentLoopManager extension point.
actor_rollout_ref:

  model:

    path: ${oc.env:MODEL_PATH,/workspace/models/Qwen3.5-4B-nothink}

    trust_remote_code: false

    use_remove_padding: false

    # Official Qwen3.5 chunked output head avoids full [tokens, vocab] entropy
    # materialization on long native tool trajectories.
    use_fused_kernels: true

    fused_kernel_options:

      impl_backend: torch

    enable_gradient_checkpointing: true

  actor:

    strategy: fsdp2

    ppo_mini_batch_size: ${oc.decode:${oc.env:PPO_MINI_BATCH_SIZE,16}}

    ppo_micro_batch_size_per_gpu: 1

    use_dynamic_bsz: true

    ppo_max_token_len_per_gpu: ${oc.decode:${oc.env:TRAIN_MAX_TOKENS_PER_GPU,36864}}

    use_torch_compile: ${oc.decode:${oc.env:USE_TORCH_COMPILE,false}}

    loss_agg_mode: seq-mean-token-mean

    entropy_coeff: 0.0

    use_kl_loss: true

    kl_loss_coef: ${oc.decode:${oc.env:KL_LOSS_COEF,0.001}}

    kl_loss_type: low_var_kl

    optim:

      lr: ${oc.decode:${oc.env:LEARNING_RATE,0.000001}}

      lr_warmup_steps: ${oc.decode:${oc.env:LR_WARMUP_STEPS,2}}

    fsdp_config:

      use_torch_compile: ${oc.decode:${oc.env:USE_TORCH_COMPILE,false}}

    checkpoint:

      save_contents: [model, optimizer, extra]

  ref:

    strategy: fsdp2

    log_prob_use_dynamic_bsz: true

    log_prob_max_token_len_per_gpu: ${oc.decode:${oc.env:TRAIN_MAX_TOKENS_PER_GPU,36864}}

  rollout:

    name: vllm

    mode: async

    n: ${oc.decode:${oc.env:ROLLOUT_N,4}}

    temperature: 1.0

    top_p: 1.0

    top_k: -1

    calculate_log_probs: true

    logprobs_mode: processed_logprobs

    tensor_model_parallel_size: ${oc.decode:${oc.env:ROLLOUT_TP,1}}

    gpu_memory_utilization: ${oc.decode:${oc.env:GPU_MEMORY_UTILIZATION,0.55}}

    prompt_length: ${data.max_prompt_length}

    response_length: ${data.max_response_length}

    max_model_len: ${oc.decode:${oc.env:MAX_MODEL_LENGTH,36864}}

    max_num_batched_tokens: ${oc.decode:${oc.env:MAX_NUM_BATCHED_TOKENS,8192}}

    max_num_seqs: ${oc.decode:${oc.env:MAX_NUM_SEQS,32}}

    enable_chunked_prefill: true

    enforce_eager: ${oc.decode:${oc.env:ENFORCE_EAGER,false}}

    free_cache_engine: true

    checkpoint_engine:

      # The pinned sync trainer uses colocated solver synchronization. EMA
      # curator transport is configured separately and never reuses this route.
      backend: naive

    val_kwargs:

      do_sample: false

      temperature: 0.0

      top_p: 1.0

      top_k: -1

      n: 1

    multi_turn:

      enable: true

      max_parallel_calls: 1

      format: qwen3_coder

    agent:

      agent_loop_manager_class: uni_agent.framework.entry.AgentFrameworkRolloutAdapter

    custom:

      agent_framework:

        gateway_count: ${oc.decode:${oc.env:GATEWAY_COUNT,8}}

        log_dir: ${oc.env:SKILL_RUN_DIR}/agent_logs

        allowed_request_sampling_param_keys: [temperature, top_p, top_k]

        mask_unfinished_episode: false

        agent_runners:

          task:

            runner_fqn: verl.experimental.skill_harness.alfworld.runner.run_task

            dispatch_mode: ray_task

            max_concurrent_sessions: ${oc.decode:${oc.env:ROLLOUT_CONCURRENCY,64}}

            trajectory_selection: all

            runner_kwargs:

              task_config_path: ${oc.env:ALFWORLD_TASK_CONFIG}

              model_name: Qwen3.5-4B-nothink

# The Task result comes from the private ALFWorld engine, not an LLM judge.
reward:

  custom_reward_function:

    path: pkg://uni_agent.framework.task_runner

    name: score_from_runner_result

# TransferQueue carries exact model tokens and their generation log probabilities.
transfer_queue:

  enable: true

# The custom entry point must reject unsupported modes instead of ignoring them.
skill_harness:

  mode: solver_baseline

  artifact_root: ${oc.env:SKILL_RUN_DIR}

  store_root: ${oc.env:SKILL_RUN_DIR}/skill_store

  split_manifest: ${oc.env:ALFWORLD_DATA_DIR}/split_manifest.json

  evaluation:

    initial: ${oc.decode:${oc.env:EVALUATE_OFFICIAL_TESTS,false}}

    final: ${oc.decode:${oc.env:EVALUATE_OFFICIAL_TESTS,false}}

  ema:

    enabled: false

    decay: 0.95

    update_every: 1

# The parent entry point merges bootstrap.runtime_env_config before Ray starts.
ray_kwargs:

  ray_init:

    num_cpus: ${oc.decode:${oc.env:RAY_NUM_CPUS,64}}

    object_store_memory: 8589934592

    include_dashboard: false

    runtime_env:

      worker_process_setup_hook: verl.experimental.skill_harness.bootstrap.configure_worker

# Scheduled validation uses train-derived dev only. Test is an explicit final run.
trainer:

  use_v1: true

  v1:

    trainer_mode: ${oc.env:TRAINER_MODE,sync}

  nnodes: 1

  n_gpus_per_node: ${oc.decode:${oc.env:TRAINING_GPUS,8}}

  project_name: alfworld_skill_self_evolve

  experiment_name: ${oc.env:EXPERIMENT_NAME,alfworld_codex_qwen35_4b}

  logger: [console, tensorboard]

  total_epochs: ${oc.decode:${oc.env:TOTAL_EPOCHS,4}}

  total_training_steps: ${oc.decode:${oc.env:TOTAL_TRAINING_STEPS,64}}

  test_freq: ${oc.decode:${oc.env:DEV_EVAL_FREQUENCY,4}}

  save_freq: ${oc.decode:${oc.env:SAVE_FREQUENCY,8}}

  val_before_train: true

  log_val_generations: 4

  resume_mode: ${oc.env:RESUME_MODE,auto}

  default_local_dir: ${oc.env:SKILL_RUN_DIR}/checkpoints

  rollout_data_dir: ${oc.env:SKILL_RUN_DIR}/rollouts

  validation_data_dir: ${oc.env:SKILL_RUN_DIR}/validation

  max_actor_ckpt_to_keep: ${oc.decode:${oc.env:MAX_CHECKPOINTS,2}}
